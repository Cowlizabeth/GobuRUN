
      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path("game/export_presets.cfg")
          s = p.read_text()

          settings = {
              "keystore/debug": os.path.expanduser("~/.android/debug.keystore"),
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          for key, value in settings.items():
              import re
              pattern = r'(?m)^' + re.escape(key) + r'=.*$'
              s = re.sub(pattern, key + '="' + value + '"', s)

          p.write_text(s)
          PY

          mkdir -p build
          godot --headless --verbose --path game \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/GoblinRunner-debug.apk"

          test -s build/GoblinRunner-debug.apk
          

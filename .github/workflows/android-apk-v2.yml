
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game build
          unzip -q -o GoblinRunner-Fixed-Android.zip -d game
          test -f game/project.godot
          test -f game/main.tscn
          test -f game/export_presets.cfg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.4.1-stable"

          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            "$BASE/Godot_v4.4.1-stable_linux.x86_64.zip"

          sudo unzip -q /tmp/godot.zip -d /usr/local/bin
          sudo mv \
            /usr/local/bin/Godot_v4.4.1-stable_linux.x86_64 \
            /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          curl -fL --retry 3 \
            -o /tmp/templates.tpz \
            "$BASE/Godot_v4.4.1-stable_export_templates.tpz"

          mkdir -p /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"

          unzip -q /tmp/templates.tpz \
            "templates/android_debug.apk" \
            "templates/android_release.apk" \
            "templates/version.txt" \
            -d /tmp/godot-templates

          cp /tmp/godot-templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

          godot --version

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"

          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"

          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          test -f "$ANDROID_HOME/platform-tools/adb"
          test -x "$JAVA_HOME/bin/java"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Fix Android export preset
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("game/export_presets.cfg")
          data = path.read_text()

          values = {
              "keystore/debug": str(
                  Path.home() / ".android/debug.keystore"
              ),
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          for key, value in values.items():
              pattern = (
                  r'(?m)^'
                  + re.escape(key)
                  + r'=.*$'
              )
              replacement = key + '="' + value + '"'

              if re.search(pattern, data):
                  data = re.sub(
                      pattern,
                      lambda match: replacement,
                      data
                  )
              else:
                  data += "\n" + replacement

          path.write_text(data)

          print("Debug signing configured")
          print("Preset exists:", path.exists())
          PY

          test -f "$HOME/.android/debug.keystore"

      - name: Import assets
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path game \
            --editor --import --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --verbose \
            --path game \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/GoblinRunner-debug.apk"

          test -s build/GoblinRunner-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoblinRunner-Android
          path: build/GoblinRunner-debug.apk
          if-no-files-found: error
          retention-days: 14
          

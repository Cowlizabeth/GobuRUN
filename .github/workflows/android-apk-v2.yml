
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack game and fix textures
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p game build
          unzip -q -o GoblinRunner-Fixed-Android.zip -d game

          test -f game/project.godot
          test -f game/main.tscn
          test -f game/export_presets.cfg

          python3 - <<'PY'
          from pathlib import Path

          p = Path("game/project.godot")
          data = p.read_text()

          setting = "textures/vram_compression/import_etc2_astc=true"

          if setting not in data:
              if "[rendering]" in data:
                  data = data.replace(
                      "[rendering]",
                      "[rendering]\n" + setting,
                      1
                  )
              else:
                  data += "\n[rendering]\n" + setting + "\n"

          p.write_text(data)
          print("ETC2/ASTC texture import enabled")
          PY

          grep "import_etc2_astc=true" game/project.godot

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          test -f "$ANDROID_HOME/platform-tools/adb"

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download/4.4.1-stable"

          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            "$BASE/Godot_v4.4.1-stable_linux.x86_64.zip"

          sudo unzip -q /tmp/godot.zip -d /usr/local/bin

          sudo mv \
            /usr/local/bin/Godot_v4.4.1-stable_linux.x86_64 \
            /usr/local/bin/godot

          sudo chmod +x /usr/local/bin/godot

          curl -fL --retry 3 \
            -o /tmp/templates.tpz \
            "$BASE/Godot_v4.4.1-stable_export_templates.tpz"

          mkdir -p /tmp/godot-templates

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"

          unzip -q /tmp/templates.tpz \
            "templates/android_debug.apk" \
            "templates/android_release.apk" \
            "templates/version.txt" \
            -d /tmp/godot-templates

          cp /tmp/godot-templates/templates/* "$TEMPLATE_DIR/"

          godot --version

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"

          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure export preset
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("game/export_presets.cfg")
          data = path.read_text()

          values = {
              "keystore/debug": str(
                  Path.home() / ".android/debug.keystore"
              ),
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
              "gradle_build/use_gradle_build": False,
              "architectures/arm64-v8a": True,
          }

          for key, value in values.items():
              if isinstance(value, bool):
                  encoded = str(value).lower()
              else:
                  encoded = '"' + value + '"'

              pattern = r"(?m)^" + re.escape(key) + r"=.*$"
              replacement = key + "=" + encoded

              if not re.search(pattern, data):
                  raise RuntimeError("Missing: " + key)

              data = re.sub(
                  pattern,
                  lambda _: replacement,
                  data
              )

          path.write_text(data)
          print("Android export preset configured")
          PY

      - name: Import assets
        shell: bash
        run: |
          set -euo pipefail

          godot --headless \
            --path game \
            --editor \
            --import \
            --quit

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --verbose \
            --path game \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/GoblinRunner-debug.apk"

          test -s build/GoblinRunner-debug.apk
          unzip -tq build/GoblinRunner-debug.apk
          ls -lh build/GoblinRunner-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoblinRunner-Android
          path: build/GoblinRunner-debug.apk
          if-no-files-found: error
          retention-days: 14
          

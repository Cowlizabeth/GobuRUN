
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game build
          unzip -q GoblinRunner-Fixed-Android.zip -d game
          test -f game/project.godot
          test -f game/main.tscn
          test -f game/export_presets.cfg

      - name: Import Godot assets
        run: godot --headless --path game --editor --import --quit

      - name: Export debug APK
        run: |
          godot --headless --path game \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/GoblinRunner-debug.apk"
          test -s build/GoblinRunner-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoblinRunner-Android
          path: build/GoblinRunner-debug.apk
          if-no-files-found: error
          
